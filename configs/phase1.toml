# MiniRaw Phase 1 benchmark configuration. All tunables chosen on the dev split.
step = 1.0
steps = [0.5, 1.0, 1.5, 2.0]
tile = 512
effort = 7               # effort 9: -0.9% L2 at 4.9x encode time (bench/experiments/packing.py)
packing = "P3"           # one 4-channel image per tile; -1.5% L2, -0.4% B2 vs P1 on dev (D21)
