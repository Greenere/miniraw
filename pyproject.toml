[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniraw"
version = "0.1.0"
description = "MiniRaw: layered RAW codestream with a noise-calibrated hot tier and an exact cold tier"
requires-python = ">=3.11"
dependencies = [
  "numpy", "scipy", "rawpy", "imagecodecs", "constriction", "zstandard", "msgpack",
  "tifffile", "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
miniraw = "miniraw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
